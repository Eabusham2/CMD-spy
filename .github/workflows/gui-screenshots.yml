name: gui-screenshots

# Renders the CMD-spy window on a real Windows desktop — for a "before" commit
# and for the current code — and smoke-tests the start-up paths of the current
# code (boot service as LocalSystem, the elevated high-priority logon task,
# single instance). Run it from the Actions tab; results are in the
# "gui-screenshots" artifact.
on:
  workflow_dispatch:
    inputs:
      before:
        description: Full commit SHA (or tag) to show as "before"
        required: false
        default: eeacf83a4c1a8907dc400f6f50c7fd97ba547c25

permissions:
  contents: read

jobs:
  screenshots:
    name: Screenshots + start-up smoke test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout (current)
        uses: actions/checkout@v4
        with:
          path: after

      - name: Checkout (before)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.before }}
          path: before

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Full-HD desktop
        shell: pwsh
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop; "Resolution set to 1920x1080." }
          catch { "Could not change the resolution: $($_.Exception.Message)" }

      - name: Build the screenshot harness against both versions
        shell: pwsh
        run: |
          foreach ($v in 'before', 'after') {
            Copy-Item after/tools/GuiScreenshot "harness-$v" -Recurse
            dotnet build "harness-$v/GuiScreenshot.csproj" -c Release -o "bin-$v" "-p:AppProject=$env:GITHUB_WORKSPACE\$v\src\CmdSpy.App\CmdSpy.App.csproj"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

      - name: Screenshot (before)
        shell: pwsh
        run: |
          $p = Start-Process bin-before/GuiScreenshot.exe -ArgumentList 'shots', 'before' -Wait -PassThru
          Get-Content shots/before-harness.log
          "exit code $($p.ExitCode)"

      - name: Screenshot (after)
        shell: pwsh
        run: |
          $p = Start-Process bin-after/GuiScreenshot.exe -ArgumentList 'shots', 'after' -Wait -PassThru
          Get-Content shots/after-harness.log
          "exit code $($p.ExitCode)"

      - name: Publish the current app as released (self-contained, ReadyToRun)
        run: dotnet publish after/src/CmdSpy.App/CmdSpy.App.csproj -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=true -o app

      - name: Smoke-test start-up (boot service, logon task, single instance)
        shell: pwsh
        run: |
          $p = Start-Process bin-after/GuiScreenshot.exe -ArgumentList '--smoke', "$env:GITHUB_WORKSPACE\app\CmdSpy.exe", 'shots' -Wait -PassThru
          Get-Content shots/smoke.log
          exit $p.ExitCode

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-screenshots
          path: shots/
